<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomopet</title><link rel="stylesheet" href="/styles.css"></head>
<body class="pet-body"><main class="pet-stage" id="petStage" data-state="idle">
  <section class="speech hidden" id="speech"><strong id="speechLabel"></strong><span id="speechText"></span><div class="speech-actions hidden" id="speechActions"><button id="snoozeAlarm">再睡 10 分钟</button><button id="dismissAlarm">知道啦</button></div></section>
  <div class="sparkles"><i></i><i></i><i></i></div><img class="toy" src="/assets/ball.svg" alt="玩具球"><img class="pet-art" id="petArt" src="/assets/momo.svg" alt="桌面小狗末末">
  <div class="pet-hotspot" id="petHotspot" title="点我和末末玩"></div><button class="pet-menu" id="petMenu" aria-label="打开 Pomopet 小屋">···</button>
  <div class="quick-menu hidden" id="quickMenu"><button data-interaction="interactionPet">摸摸头</button><button data-interaction="interactionFeed">喂零食</button><button data-interaction="interactionBall">扔球</button><button data-interaction="comfort">求安慰</button><button id="openControl">打开小屋</button><button id="hidePet">躲一会儿</button></div>
</main><script type="module" src="/pet.js"></script></body></html>
