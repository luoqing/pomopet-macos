<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomopet</title><link rel="stylesheet" href="/styles.css"></head>
<body class="pet-body"><main class="pet-stage" id="petStage" data-state="idle">
  <section class="speech hidden" id="speech"><strong id="speechLabel"></strong><span id="speechText"></span><div class="speech-actions hidden" id="speechActions"><button id="snoozeReminder">10 分钟后提醒</button><button id="dismissReminder">知道啦</button><button id="rewardFeed">奖励饼干</button><button id="rewardPlay">陪它玩球</button><button id="breakPrimary">继续刚才的任务</button><button id="breakChoose">换下一件</button><button id="breakIdle">先不开始</button></div></section>
  <section class="pet-timer hidden" id="petTimer" aria-label="当前计时状态"><div class="pet-timer-main"><div class="pet-timer-copy"><strong id="petTimerPhase"></strong><span id="petTimerTask"></span></div><time id="petTimerTime"></time></div><div class="pet-timer-controls" id="petTimerControls"><button id="petTimerPause">暂停</button><button id="petTimerFinish">提前完成</button><button id="petTimerStop" aria-label="停止计时">停止</button></div><div class="pet-timer-progress"><i id="petTimerProgress"></i></div></section>
  <div class="sparkles"><i></i><i></i><i></i></div><img class="pet-art" id="petArt" src="/assets/pet/momo-focus.png" alt="桌面小狗末末">
  <div class="pet-hotspot" id="petHotspot" title="拖动末末"></div><button class="pet-menu" id="petMenu" aria-label="打开 Pomopet 小屋">···</button>
  <div class="quick-menu hidden" id="quickMenu"><div class="quick-poses"><button data-pose="focus">专注</button><button data-pose="reward">庆祝</button><button data-pose="ball" data-interaction="interactionBall">扔球</button><button data-pose="sleepy">困困</button><button data-pose="fainted">装死</button><button data-pose="annoyed">气鼓鼓</button><button data-pose="pet" data-interaction="interactionPet">摸摸头</button><button data-pose="feed" data-interaction="interactionFeed">喂零食</button><button data-pose="comfort" data-interaction="comfort">挠肚皮</button><button data-pose="water">喝水</button><button data-pose="aggrieved">求安慰</button><button data-pose="angryStanding">气得跺脚</button></div><div class="quick-tools"><div class="display-modes" role="radiogroup" aria-label="桌面显示"><small>桌面显示</small><button data-display-mode="full" role="radio">宠物和计时</button><button data-display-mode="pet" role="radio">只显示宠物</button><button data-display-mode="timer" role="radio">只显示计时</button><button data-display-mode="hidden" role="radio">全部隐藏</button></div><button class="quick-tool" id="openControl">打开小屋</button><button class="quick-tool mute-tool" id="toggleMute" aria-label="静音"><span class="mute-icon" aria-hidden="true">🔇</span><span class="mute-label">静音</span><small class="mute-state">声音开</small></button></div></div>
  <div class="pet-toast hidden" id="petToast" role="status"></div>
</main><script type="module" src="/pet.js"></script></body></html>
